services:
  shopee-affiliate:
    build: ./api
    container_name: shopee-affiliate
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HEADLESS: "false"
      SHOPEE_AN_REDIR_PERCENT: ${SHOPEE_AN_REDIR_PERCENT:-0}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      STORAGE_STATE_PATH: ./storage/storageState.json
      ZALO_BOT_TOKEN: ${ZALO_BOT_TOKEN}
      ZALO_WEBHOOK_SECRET: ${ZALO_WEBHOOK_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-truongvq.se@gmail.com}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shopee-affiliate-db:5432/${POSTGRES_DB}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM}
    # Named volumes, not bind mounts into the checkout. These three
    # directories are gitignored, so they follow the checkout's layout without
    # git ever moving them: renaming playwright-service/ to api/ in af8f627
    # moved only the tracked files, the mounts started pointing at brand-new
    # empty api/ directories, and the container came back up with no Shopee
    # session at all - every crawl then failed with "tabs seen: none" while
    # /status still reported a healthy login. A named volume is keyed by its
    # own name, so it survives any rename, clean or rebuild of the checkout.
    volumes:
      - shopee-affiliate-session:/app/storage
      - shopee-affiliate-bank-logos:/app/public/bank-logos
      # Uploaded banner artwork - outside the image so a rebuild never wipes it.
      - shopee-affiliate-banner-uploads:/app/public/banner-uploads
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - shopee-affiliate-db
      - rabbitmq
    networks:
      - shared_net

  # Withdrawal-creation consumer - deliberately its own container (built from
  # the lightweight Dockerfile.worker, not the heavy Playwright image) so a
  # routine deploy of the main API service doesn't restart it mid-processing.
  withdrawal-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    container_name: shopee-affiliate-withdrawal-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@shopee-affiliate-db:5432/${POSTGRES_DB}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - shopee-affiliate-db
      - rabbitmq
    networks:
      - shared_net

  # No public ports - RabbitMQ (including its 15672 management UI) is only
  # reachable from other containers on shared_net, matching how
  # shopee-affiliate-db's Postgres port is kept loopback-only.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shopee-affiliate-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - shopee-affiliate-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - shared_net

  shopee-affiliate-db:
    image: postgres:16-alpine
    container_name: shopee-affiliate-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - shopee-affiliate-db-data:/var/lib/postgresql/data
    networks:
      - shared_net

  client:
    build: ./client
    container_name: shopee-affiliate-client
    restart: unless-stopped
    ports:
      - "4100:3000"
    environment:
      BACKEND_URL: http://shopee-affiliate:4000
      BACKEND_API_KEY: ${SERVICE_API_KEY}
    depends_on:
      - shopee-affiliate
    networks:
      - shared_net

networks:
  shared_net:
    external: true

volumes:
  shopee-affiliate-db-data:
  shopee-affiliate-rabbitmq-data:
  shopee-affiliate-session:
  shopee-affiliate-bank-logos:
  shopee-affiliate-banner-uploads:
