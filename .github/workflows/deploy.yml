name: Deploy Shopee Affiliate Service

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90m
          # Non-secret settings - bucket, endpoint, schedule - are in the repo so
          # a replacement box configures itself. Only the key pair comes through
          # here, and it is absent on a fork or before the secrets are added,
          # which provision-backup.sh treats as "say so and carry on".
          envs: R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull --ff-only
            # Idempotent on purpose: standing up a new VPS should be this deploy
            # and nothing else, so the backup wiring is re-applied every time
            # rather than being something to remember.
            bash scripts/provision-backup.sh
            # A migration that goes wrong takes the database with it, and this is
            # the only moment we know one is about to run. --local because this
            # snapshot exists to undo the deploy, so it is useful sitting right
            # here; the nightly run is the one that has to leave the building.
            # KEEP_DAYS=3 because these accumulate per push, not per day.
            BACKUP_LABEL=predeploy KEEP_DAYS=3 bash scripts/backup.sh --local
            # --remove-orphans: the web service used to be called admin-web. Without it
            # the old container keeps port 4100 and the renamed one cannot start.
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker builder prune -f --filter unused-for=24h
