name: Deploy Shopee Affiliate Service

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 90m
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull --ff-only
            # --remove-orphans: the web service used to be called admin-web. Without it
            # the old container keeps port 4100 and the renamed one cannot start.
            docker compose up -d --build --remove-orphans
            docker image prune -f
            docker builder prune -f --filter unused-for=24h
